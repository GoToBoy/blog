{{- $body := .Params.summary -}}
{{- if not $body -}}
    {{- $body = .Summary -}}
{{- end -}}

<article class="article-card article-card--reflection">
    <div class="article-card__top-bar" aria-hidden="true"></div>
    <div class="article-card__eyebrow">
        <span class="article-card__eyebrow-icon" aria-hidden="true">💭</span>
        <span data-localized-label data-label-en="Reflection" data-label-zh="思考">Reflection</span>
    </div>
    <h3 class="article-card__title">
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h3>
    {{ with $body }}
        <p class="article-card__body">{{ . | plainify }}</p>
    {{ end }}
    <div class="article-card__meta">
        <time class="article-card__meta-item" datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format "2006-01-02" }}
        </time>
        {{ if and .Site.Params.article.readingTime .ReadingTime }}
            <span class="article-card__meta-item">{{ .ReadingTime }} min</span>
        {{ end }}
    </div>
</article>
