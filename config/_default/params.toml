# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["posts"]
# Output page's full content in RSS.
rssFullContent = true
favicon        = "img/favicon.png"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[footer]
    since      = 2026
    customText = "Writing in Obsidian. Publishing with Hugo."

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[sidebar]
    emoji    = "◦"
    subtitle = "A quiet place for notes, code, and long-form thinking."
    avatar   = "img/avatar-zen.svg"

[homepage]
    readingTitle    = "阅读摘记"
    reflectionTitle = "思考随笔"
    topicsTitle     = "主题浏览"
    recentTitle     = "最近更新"
    readingLimit    = 4
    reflectionLimit = 4
    topicsLimit     = 8
    recentLimit     = 6
    readingEmptyText = "阅读摘记还在整理中。"
    reflectionEmptyText = "思考随笔还在整理中。"
    topicsEmptyText = "主题索引正在慢慢长出来。"
    recentEmptyText = "最近还没有新的更新。"

[article]
    headingAnchor = false
    math          = false
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[widgets]
    homepage = [
        { type = "search" },
        { type = "archives", params = { limit = 5 } },
        { type = "categories", params = { limit = 10 } },
    ]
    page = [{ type = "toc" }]

[opengraph.twitter]
    site = ""
    card = "summary_large_image"

[colorScheme]
    toggle  = true
    default = "auto"

[comments]
    enabled  = false
